[package]
name = "lawgit"
version = "0.1.0"
edition = "2021"
description = "A Git-based legal document management CLI"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
roxmltree = "0.20"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "git-law"
path = "src/bin/git-law.rs"
