[package]
name = "lawgit"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
description = "Manage legal documents and user-authored rules as structured XML in a Git repository"
license = "MIT"

[lib]
name = "lawgit_core"
path = "src/lib.rs"

[[bin]]
name = "lawgit"
path = "src/main.rs"

[[bin]]
name = "git-law"
path = "src/bin/git-law.rs"

[dependencies]

[profile.release]
opt-level = 3
